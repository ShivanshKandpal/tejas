name: Tejas CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake g++

    - name: Configure CMake (CPU-Only Mode)
      run: |
        mkdir build
        cd build
        cmake .. -DSKIP_CUDA=ON

    - name: Build the Project
      run: |
        cd build
        make -j4

    - name: Run CPU Test Suite
      run: |
        ./build/test_tensor

    - name: Run Gradient Check
      run: ./build/test_gradcheck

    - name: Run XOR Integration Test
      run: |
        ./build/xor
        
    - name: Run Attention Forward Pass
      run: ./build/attention

    - name: Run Transformer Block Example  
      run: ./build/transformer_block